<!--
  Контур Хабаровского Утёса. Отрисован по фотографии набережной.
  Одна линия, без заливки. Цвет и толщина задаются снаружи через
  currentColor / stroke-width родителя.

  ВАЖНО: не выводить с preserveAspectRatio="none" на всю ширину —
  здание растянется. Полоса собирается из двух слоёв:
    1) горизонтали (стена набережной, вода) — тянутся на всю ширину;
    2) этот файл — в своих пропорциях, прижат к правому краю.

  Группы внутри помечены id, чтобы можно было собрать сокращённые
  версии: #utes-hill + #utes-building — только холм со зданием,
  #utes-wall — только набережная (годится как разделитель).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240"
     fill="none" stroke="currentColor" stroke-width="1.4"
     stroke-linecap="round" stroke-linejoin="round">

  <!-- дальний берег -->
  <path d="M0 193h58"/>

  <!-- склон слева, уходит за здание -->
  <path d="M98 198C108 196 116 190 121 182C126 174 130 166 137 160
           C143 155 148 154 154 148C160 142 163 136 170 131
           C176 127 182 128 188 124C195 120 200 116 206 113
           C211 111 216 111 220 110"/>

  <!-- гребень справа, от здания к правому краю -->
  <path d="M326 94C332 88 338 78 346 70C352 64 358 62 364 64
           C370 66 374 70 380 70C386 70 390 64 396 62
           C402 60 408 62 414 58C420 54 426 50 432 50
           C438 50 444 52 450 52C452 52 454 52 456 52
           C464 52 470 48 478 47C486 46 494 48 502 46
           C512 44 522 46 532 44C542 42 552 44 560 42"/>

  <!-- корпус: низ не замыкается, здание выходит из зелени -->
  <path d="M220 128V81h106v47"/>
  <path d="M220 102h106"/>

  <!-- башня -->
  <path d="M272 81V34h30v47"/>
  <path d="M268 56h38"/>

  <!-- бельведер -->
  <path d="M269 34h36"/>
  <path d="M274 34V24M282 34V24M291 34V24M299 34V24"/>
  <path d="M267 24h40"/>
  <path d="M287 24v-8"/>

  <!-- кроны перед зданием -->
  <path d="M176 128C186 134 194 132 204 130C214 128 220 127 229 125
           C239 123 247 129 257 127C267 125 275 129 285 127
           C295 125 303 129 313 127C323 125 331 129 341 128
           C350 127 356 131 362 137"/>

  <!-- памятник -->
  <path d="M450 52V34h12v18"/>
  <path d="M448 34h16"/>
  <path d="M452 34C452 25 454 18 456 16C458 18 460 25 460 34"/>

  <!-- стена набережной -->
  <path d="M66 198h494"/>
  <path d="M66 220h494"/>
  <path d="M126 198v22M186 198v22M246 198v22M306 198v22M366 198v22M426 198v22M486 198v22M546 198v22"/>

  <!-- фонари -->
  <g stroke-width="1.1">
    <path d="M116 198v-36M161 198v-36M224 198v-36M280 198v-36M336 198v-36M399 198v-36M462 198v-36"/>
    <circle cx="116" cy="159" r="2.5"/><circle cx="161" cy="159" r="2.5"/>
    <circle cx="224" cy="159" r="2.5"/><circle cx="280" cy="159" r="2.5"/>
    <circle cx="336" cy="159" r="2.5"/><circle cx="399" cy="159" r="2.5"/>
    <circle cx="462" cy="159" r="2.5"/>
  </g>

  <!-- вода -->
  <path d="M0 206c14 3 28 3 42 0M0 217c18 3 34 3 52 0" stroke-width="1.1"/>
</svg>
