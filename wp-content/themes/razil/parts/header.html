<!-- Телефон резервный: фактический задаётся в Настройки → Организация. -->

<!-- wp:group {"tagName":"header","className":"rz-header"} -->
<header class="wp-block-group rz-header">
	<!-- wp:group {"className":"rz-header__inner"} -->
	<div class="wp-block-group rz-header__inner">

		<!-- Ссылка на главную обёрнута двумя wp:html: открывающий тег в одном,
		     закрывающий в другом. Так эмблема и название остаются отдельными
		     редактируемыми блоками, а кликабельна вся группа целиком.
		     Удалять эти два блока можно только вместе. -->
		<!-- wp:html -->
		<a class="rz-header__brand-link" href="/" aria-label="Земля и Люди, на главную">
		<!-- /wp:html -->

		<!-- wp:group {"className":"rz-header__brand"} -->
		<div class="wp-block-group rz-header__brand">
			<!-- wp:image {"id":96,"width":73,"height":40,"sizeSlug":"full","linkDestination":"none","className":"rz-header__logo"} -->
			<figure class="wp-block-image size-full rz-header__logo"><img src="http://ra-zil.test/wp-content/uploads/2026/08/logo-emblema-zelenyy-146.png" alt="" class="wp-image-96" width="73" height="40" loading="eager" decoding="async"/></figure>
			<!-- /wp:image -->

			<!-- wp:paragraph {"className":"rz-header__title"} -->
			<p class="rz-header__title">Земля и Люди</p>
			<!-- /wp:paragraph -->
		</div>
		<!-- /wp:group -->

		<!-- wp:html -->
		</a>
		<!-- /wp:html -->

		<!-- wp:group {"className":"rz-header__nav"} -->
		<div class="wp-block-group rz-header__nav">
			<!-- wp:paragraph -->
			<p><a href="/uslugi/">Услуги</a></p>
			<!-- /wp:paragraph -->

			<!-- wp:paragraph -->
			<p><a href="/otzyvy/">Отзывы</a></p>
			<!-- /wp:paragraph -->

			<!-- wp:paragraph -->
			<p><a href="/o-kompanii/">О нас</a></p>
			<!-- /wp:paragraph -->

			<!-- wp:paragraph -->
			<p><a href="/kontakty/">Контакты</a></p>
			<!-- /wp:paragraph -->
		</div>
		<!-- /wp:group -->

		<!-- wp:group {"className":"rz-header__actions"} -->
		<div class="wp-block-group rz-header__actions">
			<!-- wp:paragraph {"className":"rz-header__phone"} -->
			<p class="rz-header__phone"><a href="tel:+74212605290">+7 (4212) 60-52-90</a></p>
			<!-- /wp:paragraph -->

			<!-- wp:buttons {"className":"rz-header__cta"} -->
			<div class="wp-block-buttons rz-header__cta">
				<!-- wp:button -->
				<div class="wp-block-button"><a class="wp-block-button__link wp-element-button" href="tel:+74212605290">Вызвать агента</a></div>
				<!-- /wp:button -->
			</div>
			<!-- /wp:buttons -->
		</div>
		<!-- /wp:group -->

		<!-- Бургер служебный: клиенту в нём править нечего, а три span
		     внутри кнопки редактор бы вычистил. Поэтому wp:html. -->
		<!-- wp:html -->
		<button class="rz-header__burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="rz-menu" data-rz-burger>
			<span></span><span></span><span></span>
		</button>
		<!-- /wp:html -->

	</div>
	<!-- /wp:group -->
</header>
<!-- /wp:group -->

<!-- Мобильная панель открывается под шапкой, поэтому лежит рядом с ней,

	<!-- /wp:group -->

</div>
