<!-- ОБОЛОЧКА СТРАНИЦЫ УСЛУГИ.

     Раскладка «поток», а не «ограниченная», и БЕЗ боковых полей —
     это и есть условие того, чтобы секция с align: full легла от края
     до края окна. Раньше здесь стояла ограниченная группа с инлайновым
     padding-inline: 1rem, и полноширинность приходилось подделывать
     тенью в 100vmax: заливка растягивалась, а сама коробка секции
     оставалась в контейнере, и фотография до края окна не доходила.

     Боковые поля теперь у каждого потомка свои, задаются в main.css
     разделом «Страницы услуг — редизайн 2026-09». Там же полноширинные
     секции вытягиваются обратно на эти поля.

     Боковые нули заданы ЯВНО и не лишние: правило
     .wp-block-group.has-background в main.css:274 даёт группе с заливкой
     padding: 2rem со всех сторон. Без нулей оболочка съедала бы по 2rem
     с каждого края, и полноширинная секция на 375 px не доходила бы
     до края окна на 32 px — замерено.

     Поля у оболочки нулевые со всех сторон. Сверху воздух даёт
     правило main.css:2219 (0.5rem под крошками) и собственное поле
     первого экрана, снизу к ней вплотную примыкает полоса заявки.

     ЗАГОЛОВКА И ОТРЫВКА ВНУТРИ БОЛЬШЕ НЕТ. Их печатает паттерн первого
     экрана (razil/service-hero) — core/post-title и core/post-excerpt
     внутри самой секции. Пока они стояли и тут, и там, на каждой
     переделанной странице было по два H1; обход это и показывал
     строкой «H1=2». Вместе с ними ушла и обёртка .rz-svc-head:
     держать её было нечего, а её боковое поле теперь задаёт себе
     каждая секция.

     РАСКЛАДКА «ОГРАНИЧЕННАЯ» стоит у самого содержимого, а не у обёртки.
     Только так потомок с align: full получает от ядра max-width: none,
     а обычный блок — ширину контейнера 72.5rem по центру.

     ПОЧЕМУ ЭТИ ПОЯСНЕНИЯ СНАРУЖИ ГРУППЫ, А НЕ ВНУТРИ НЕЁ. HTML-комментарий
     внутри содержимого блока ломает проверку блока в редакторе: save()
     группы печатает пустой <div>, а из разметки приходит <div> с текстом
     комментария, и редактор говорит «Блок содержит неожиданное
     содержимое». Замерено 25 сентября: в консоли редактора на каждой
     из пяти страниц висело по три таких сообщения про core/group,
     и все три снялись переносом комментариев наружу. Снаружи блока
     комментарий безопасен — он не попадает ни в один innerContent. -->
