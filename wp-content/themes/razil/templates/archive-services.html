<!-- wp:group {"style":{"color":{"background":"var(\u002d\u002drz-bg)"},"spacing":{"padding":{"top":"3rem","right":"1rem","bottom":"3rem","left":"1rem"}}},"layout":{"type":"constrained"}} -->
<div class="wp-block-group has-background" style="background-color:var(--rz-bg);padding-top:3rem;padding-right:1rem;padding-bottom:3rem;padding-left:1rem">
	<!-- wp:group {"layout":{"type":"constrained"}} -->
	<div class="wp-block-group">
		<!-- wp:heading {"level":1} -->
		<h1>Все услуги</h1>
		<!-- /wp:heading -->

		<!-- wp:paragraph {"fontSize":"body","style":{"spacing":{"margin":{"top":"1rem"}}}} -->
		<p class="has-body-font-size" style="margin-top:1rem">Полный спектр услуг организации похорон и поминовения</p>
		<!-- /wp:paragraph -->

		<!-- wp:query {"queryId":2,"query":{"perPage":9,"pages":0,"offset":0,"postType":"services","order":"asc","orderBy":"menu_order","author":"","search":"","exclude":[],"sticky":"","inherit":false}} -->
		<div class="wp-block-query">
			<!-- Сетка карточек (§23.1): каталог помогает выбрать направление,
			     поэтому услуги стоят рядом и сравниваются взглядом, а не
			     тянутся полосами в одну колонку.

			     Карточка та же, что на главной: колонка, ссылка «Узнать
			     подробнее» прижата к низу авто-полем, поэтому у карточек
			     с описаниями разной длины кнопки стоят на одной линии.

			     Цены здесь нет намеренно. §23.1 разрешает её показывать,
			     «только если она действительно помогает сравнению
			     и поддерживается в актуальном состоянии», а на страницах
			     услуг во всех ячейках стоимости стоит заглушка «…» —
			     сравнивать нечего.

			     Иконку слева от заголовка добавляет фильтр
			     razil_service_card_icon() в плагине. -->
			<!-- wp:post-template {"className":"rz-services-grid","layout":{"type":"default"}} -->
			<!-- Класс сетки стоит ТОЛЬКО в атрибутах блока: его WordPress вешает
			     на свой <ul>, который и становится сеткой. В сохранённой
			     обёртке ниже класса быть не должно — она повторяется внутри
			     каждого <li>, и сетка получилась бы вложенной сама в себя:
			     карточка сжималась до трети колонки, то есть до 111 px. -->
			<div class="wp-block-post-template is-layout-flow">
				<!-- wp:group {"className":"rz-service-card rz-service-card\u002d\u002dflat"} -->
				<div class="wp-block-group rz-service-card rz-service-card--flat">
					<!-- wp:group {"className":"rz-service-card__body"} -->
					<div class="wp-block-group rz-service-card__body">
						<!-- wp:post-title {"isLink":true,"fontSize":"heading-s"} /-->
						<!-- wp:post-excerpt {"fontSize":"body"} /-->
						<!-- wp:read-more {"content":"Узнать подробнее","textColor":"surface","className":"rz-service-card__more","style":{"spacing":{"padding":{"top":"0","right":"1.5rem","bottom":"0","left":"1.5rem"}}}} /-->
					</div>
					<!-- /wp:group -->
				</div>
				<!-- /wp:group -->
			</div>
			<!-- /wp:post-template -->
		</div>
		<!-- /wp:query -->

		<!-- wp:group {"className":"rz-callback","layout":{"type":"constrained"}} -->
		<div class="wp-block-group rz-callback">
			<!-- wp:paragraph {"className":"rz-callback__lead"} -->
			<p class="rz-callback__lead">Остались вопросы — оставьте заявку, и специалист перезвонит сам.</p>
			<!-- /wp:paragraph -->

			<!-- wp:shortcode -->
			[razil_callback_button]
			<!-- /wp:shortcode -->
		</div>
		<!-- /wp:group -->
	</div>
	<!-- /wp:group -->
</div>
<!-- /wp:group -->
